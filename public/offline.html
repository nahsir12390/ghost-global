<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#dc2626">
    <title>Offline</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: linear-gradient(135deg, #fff5f5 0%, #ffffff 100%);
            font-family: Figtree, Arial, sans-serif;
            color: #1f2937;
        }

        .card {
            width: min(92vw, 28rem);
            padding: 2rem;
            border-radius: 1.5rem;
            background: #ffffff;
            box-shadow: 0 20px 50px rgba(15, 23, 42, 0.12);
            text-align: center;
        }

        .badge {
            width: 4rem;
            height: 4rem;
            margin: 0 auto 1rem;
            display: grid;
            place-items: center;
            border-radius: 1.25rem;
            background: #dc2626;
            color: #ffffff;
            font-weight: 700;
            font-size: 1.25rem;
        }

        h1 {
            margin: 0 0 0.75rem;
            font-size: 1.5rem;
        }

        p {
            margin: 0;
            line-height: 1.7;
            color: #6b7280;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="badge">KC</div>
        <h1>You’re offline</h1>
        <p>Please reconnect to continue browsing products, checking out, or viewing live account updates.</p>
    </div>
</body>
</html>
