<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#090909">
    <title>You’re offline · Storefront</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100svh; background: #090909; color: #fff; font-family: Figtree, Inter, system-ui, sans-serif; overflow: hidden; }
        main { min-height: 100svh; display: grid; place-items: center; padding: 1.25rem; position: relative; }
        .noise { inset: 0; opacity: .25; pointer-events: none; position: absolute; background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.13'/%3E%3C/svg%3E"); }
        .orb { width: 25rem; height: 25rem; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #ff555c, #d9272e 36%, #68080d 68%); filter: blur(1px); position: absolute; right: -12rem; top: -12rem; opacity: .85; }
        .card { width: min(100%, 29rem); padding: clamp(1.5rem, 6vw, 2.5rem); border: 1px solid rgba(255,255,255,.11); border-radius: 2rem; background: rgba(255,255,255,.06); box-shadow: 0 35px 90px rgba(0,0,0,.45); backdrop-filter: blur(20px); position: relative; z-index: 2; }
        .icon { width: 3.5rem; height: 3.5rem; display: grid; place-items: center; border-radius: 1rem; background: #d9272e; box-shadow: 0 16px 35px rgba(217,39,46,.32); font-weight: 800; }
        .eyebrow { margin-top: 2rem; color: #fb7185; font-size: .66rem; font-weight: 800; letter-spacing: .22em; text-transform: uppercase; }
        h1 { margin: .7rem 0 0; font-size: clamp(2.4rem, 10vw, 4rem); letter-spacing: -.06em; line-height: .9; }
        p { color: rgba(255,255,255,.57); line-height: 1.65; margin: 1.2rem 0 0; }
        .status { display: flex; align-items: center; gap: .6rem; color: rgba(255,255,255,.55); font-size: .75rem; margin-top: 1.5rem; }
        .dot { width: .5rem; height: .5rem; border-radius: 50%; background: #f59e0b; box-shadow: 0 0 12px #f59e0b; }
        button { width: 100%; min-height: 3.4rem; border: 0; border-radius: 1rem; background: #fff; color: #111; cursor: pointer; font: inherit; font-size: .85rem; font-weight: 750; margin-top: 1.5rem; transition: transform .2s ease, background .2s ease; }
        button:hover { background: #f5f3ee; transform: translateY(-2px); }
        button:disabled { cursor: wait; opacity: .7; transform: none; }
    </style>
</head>
<body>
    <main>
        <div class="noise"></div><div class="orb"></div>
        <section class="card">
            <div class="icon">KC</div>
            <div class="eyebrow">Connection paused</div>
            <h1>You’re<br>offline.</h1>
            <p>Your cart is safe. Reconnect to browse current products, check live prices or continue securely to checkout.</p>
            <div class="status"><span class="dot"></span><span id="connection-label">Waiting for a connection</span></div>
            <button id="retry" type="button">Try again</button>
        </section>
    </main>
    <script>
        const retryButton = document.getElementById('retry');
        const connectionLabel = document.getElementById('connection-label');
        const retry = () => { retryButton.disabled = true; retryButton.textContent = 'Checking connection…'; window.location.reload(); };
        retryButton.addEventListener('click', retry);
        window.addEventListener('online', () => { connectionLabel.textContent = 'Connection restored'; retryButton.textContent = 'Continue shopping'; retryButton.disabled = false; setTimeout(retry, 500); });
    </script>
</body>
</html>
